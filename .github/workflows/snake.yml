name: Generate Snake

on:
  schedule:
    # Refresh the snake twice a day
    - cron: "0 */12 * * *"
  # Lets you trigger the first run manually: Actions tab → "Generate Snake" → Run workflow
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # required to push the generated SVGs to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (Google-colored)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake = Google blue; dots ramp empty → blue → green → yellow → red
          outputs: |
            dist/github-snake.svg?color_snake=4285F4&color_dots=EBEDF0,4285F4,34A853,FBBC05,EA4335
            dist/github-snake-dark.svg?palette=github-dark&color_snake=4285F4&color_dots=161B22,4285F4,34A853,FBBC05,EA4335

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
